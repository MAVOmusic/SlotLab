<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bonus Hunt Vertical</title>
<style>
:root{--gold:#ffbf2a;--purple:#a855f7;--green:#39ff14;--cyan:#00e5ff;--muted:#b8a0c8;--red:#ff5540}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}
.root{position:relative;width:1080px;height:1920px}

/* Small Corner Brand Badge (Camera Safe) */
.brand{position:absolute;left:34px;top:34px;display:flex;gap:12px;align-items:center;background:rgba(20,10,30,0.88);border:2px solid rgba(180,80,255,0.8);border-radius:18px;padding:12px 18px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,0.6)}
.logo{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:conic-gradient(#ffbf2a,#a855f7,#ff2b0a,#ffbf2a);animation:spin 18s linear infinite;position:relative}
.logo:after{content:"";position:absolute;inset:15px;border-radius:50%;background:#1a0a22;border:2px solid #fff}@keyframes spin{to{transform:rotate(360deg)}}
.brand-title{font-size:24px;font-weight:1000;line-height:1}.brand-sub{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:950;margin-top:3px}

/* Bottom Stream HUD Bar */
.scrim{position:absolute;left:0;right:0;bottom:0;height:450px;background:linear-gradient(to top,rgba(12,5,20,0.98),rgba(12,5,20,0.85) 55%,rgba(12,5,20,0));pointer-events:none}
.hud{position:absolute;left:32px;right:32px;bottom:36px;background:rgba(20,10,30,0.97);border:2px solid rgba(180,80,255,0.75);border-top:5px solid #a855f7;border-radius:24px;padding:22px 24px;box-shadow:0 -10px 40px rgba(0,0,0,0.7),0 0 30px rgba(180,80,255,0.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.item{display:flex;flex-direction:column;gap:3px;justify-content:center}
.hlabel{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:1000}
.val{font-size:36px;font-weight:1000;line-height:1.1}.gold{color:var(--gold)}.green{color:var(--green);text-shadow:0 0 12px rgba(57,255,20,0.6)}.cyan{color:var(--cyan)}.mono{font-family:"Consolas","JetBrains Mono",monospace}
.sub-val{font-size:13px;color:var(--muted);font-family:"Consolas","JetBrains Mono",monospace;margin-top:2px}

.bonusText{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;text-align:center;font-size:105px;font-weight:1000;color:#ffcf48;text-shadow:0 0 18px #a855f7,0 0 46px #ff6a00,0 0 80px #000}
.bonus .bonusText{display:flex;animation:bonusText 3.2s ease forwards}
.bonus:after{content:"";position:absolute;inset:0;z-index:85;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,191,42,.25),rgba(180,80,255,.12) 30%,rgba(0,0,0,0) 70%);box-shadow:inset 0 0 220px 70px rgba(180,80,255,.45);animation:ember 1.05s ease 3}
@keyframes ember{0%,100%{opacity:0}50%{opacity:1}}@keyframes bonusText{0%,100%{opacity:0;transform:scale(.82)}15%,82%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="root" id="root">
  <div class="brand">
    <div class="logo"></div>
    <div>
      <div class="brand-title">SLOT LAB</div>
      <div class="brand-sub">BONUS HUNT</div>
    </div>
  </div>

  <div class="scrim"></div>

  <!-- Bottom Stream HUD -->
  <div class="hud">
    <div class="grid">
      <div class="item">
        <div class="hlabel">Spins This Game</div>
        <div class="val mono" id="spinsThis">0</div>
        <div class="sub-val" id="gameLabel">FITH2</div>
      </div>
      <div class="item">
        <div class="hlabel">Total Spins</div>
        <div class="val gold mono" id="totalSpins">0</div>
        <div class="sub-val">Session</div>
      </div>
      <div class="item">
        <div class="hlabel">Wagered</div>
        <div class="val cyan mono" id="wagered">£0.00</div>
        <div class="sub-val">Total Spent</div>
      </div>
      <div class="item">
        <div class="hlabel">Total Bonuses</div>
        <div class="val green mono" id="bonuses">0</div>
        <div class="sub-val" id="lastBonusTime">Last: —</div>
      </div>
      <div class="item">
        <div class="hlabel">Last Win</div>
        <div class="val mono" id="lastWin">—</div>
        <div class="sub-val" id="lastWinX">x0</div>
      </div>
      <div class="item">
        <div class="hlabel">Highest Win</div>
        <div class="val gold mono" id="highest">—</div>
        <div class="sub-val" id="highestAmt">x0 vs 20p</div>
      </div>
    </div>
  </div>

  <div class="bonusText">BONUS<br>TIME</div>
</div>
<script>
const KEY = 'bonus_hunt_state_v1';
let st = {}, lastBonusAt = 0;

function load(){
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { return {}; }
}

function render(){
  const isFITH3 = (st.currentGame || '').includes('3') || st.currentGame === 'FITH3';
  spinsThis.textContent = st.spinsThisGame || 0;
  gameLabel.textContent = isFITH3 ? 'FITH3 (£0.40)' : 'FITH2 (£0.50)';
  totalSpins.textContent = st.totalSpins || 0;
  wagered.textContent = '£' + Number(st.totalWagered || 0).toFixed(2);
  bonuses.textContent = st.totalBonuses || 0;

  if(st.lastWinAmount > 0) {
    lastWin.textContent = '£' + Number(st.lastWinAmount).toFixed(2);
    lastWinX.textContent = 'x' + (st.lastWinX || 0);
  } else {
    lastWin.textContent = '—';
    lastWinX.textContent = 'x0';
  }

  if(st.highestWinX > 0) {
    highest.textContent = 'x' + st.highestWinX;
    highestAmt.textContent = '£' + Number(st.highestWinAmount || 0).toFixed(2);
  } else {
    highest.textContent = '—';
    highestAmt.textContent = 'x0 vs 20p';
  }

  if(st.bonusAt && st.bonusAt !== lastBonusAt){
    lastBonusAt = st.bonusAt;
    document.body.classList.add('bonus');
    setTimeout(() => document.body.classList.remove('bonus'), 3400);
  }
}

async function serverLoad(){
  try {
    const d = await fetch('state.json?ts=' + Date.now(), {cache: 'no-store'}).then(r => r.json());
    if(d && typeof d === 'object' && Object.keys(d).length) {
      st = d;
      localStorage.setItem(KEY, JSON.stringify(st));
      render();
      return;
    }
  } catch(e) {}
  st = load();
  render();
}

try {
  new BroadcastChannel('bonus_hunt_v1').onmessage = e => {
    if(e.data?.type === 'state') {
      st = e.data.state;
      localStorage.setItem(KEY, JSON.stringify(st));
      render();
    }
  };
} catch(e) {}

window.addEventListener('storage', e => {
  if(e.key === KEY) {
    st = load();
    render();
  }
});

serverLoad();
setInterval(serverLoad, 700);
</script>
</body>
</html>
