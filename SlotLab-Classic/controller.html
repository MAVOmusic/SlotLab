<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spin-The-Wheel Slot Lab — OBS Dock</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#130303;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.top{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1d0705;border-bottom:1px solid #652618;font-size:12px}.brand{font-weight:900;color:#ffbf2a}a{color:#ff8a1a;text-decoration:none;font-weight:900}iframe{width:100%;height:calc(100% - 34px);border:0;background:#130303}.warn{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.78);border:1px solid #ffbf2a;border-radius:10px;padding:8px;font-size:12px;pointer-events:none;color:#ffd8ad}.ok{color:#7cff9b;font-weight:900}
</style>
</head>
<body>
<div class="top"><span class="brand">Slot Lab Dock — Live Editor</span><span><a href="overlay.html" target="_blank">Overlay</a> • <a href="wheel.html" target="_blank">Wheel</a></span></div>
<iframe src="overlay.html?edit=1&dock=1" title="Slot Lab Live Editor"></iframe>
<div class="warn" id="warn"></div>
<script>
const server = location.protocol !== 'file:';
document.getElementById('warn').innerHTML = server
 ? '<span class="ok">Server mode active:</span> overlay, dock and wheel share http://localhost:8000 storage.'
 : '<b>file:// mode:</b> dock sync may be isolated in OBS/Chrome. For perfect sync, run start_server.bat and use http://localhost:8000/controller.html';
setTimeout(()=>{document.getElementById('warn').style.display='none'},9000);
</script>
</body>
</html>
