<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Slot Lab Passive Transparent Wheel</title><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;transform:translateY(-80px)}.promo{font-weight:1000;font-size:38px;color:#39ff14;text-shadow:0 0 10px #39ff14,0 0 28px #39ff14;margin-bottom:10px}.preview{font-size:28px;font-weight:1000;text-align:center;max-width:1280px;text-shadow:0 3px 18px #000,0 0 18px #ff6a00;min-height:34px;margin-top:6px}.wheelBox{position:relative;width:560px;height:560px;filter:drop-shadow(0 18px 45px rgba(0,0,0,.85))}.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:4;border-left:27px solid transparent;border-right:27px solid transparent;border-top:52px solid #fff;filter:drop-shadow(0 0 12px #ffbf2a)}canvas{width:560px;height:560px}.step{font-size:15px;color:#ffbf2a;font-weight:950;margin-top:2px;text-shadow:0 2px 8px #000}
.hidden-all .wrap{display:none!important}/* v5.22 no gift promo override */
.promo{display:none!important}
</style></head><body><div class="wrap"><div class="promo"></div><div class="wheelBox"><div class="pointer"></div><canvas id="c" width="900" height="900"></canvas></div><div class="preview" id="preview">Waiting for dock spin...</div><div class="step" id="stepText">Passive transparent wheel</div></div><script>
const $=id=>document.getElementById(id),ctx=$('c').getContext('2d'),colors=['#ff2b0a','#ff6a00','#ffbf2a','#ff3d7f','#9b5cff','#00c2ff','#00d084','#e31bff','#ff4545','#ffc400'];let segs=[],angle=0,sel=0,lastId=null,animating=false,curStep=0;
function colorFor(i,v){return v==='Spin Again'?'#3a3f4b':colors[i%colors.length]}function shortenGameLabel(name,limit=25){const txt=String(name||'');if(txt.length<=limit)return txt;const words=txt.split(/\s+/).filter(Boolean);let out='';for(const w of words){const cand=out?out+' '+w:w;if(cand.length>limit)break;out=cand;}return (out||txt.slice(0,limit)).replace(/[\s.,:-]+$/,'')+'...'}function norm(a){a%=Math.PI*2;if(a<0)a+=Math.PI*2;return a}function pointerIndex(rot){let total=segs.reduce((s,x)=>s+(+x.w||1),0)||1,pos=norm(-rot),acc=0;for(let i=0;i<segs.length;i++){let arc=2*Math.PI*(+segs[i].w||1)/total;if(pos>=acc&&pos<acc+arc)return i;acc+=arc}return segs.length-1}function centerFor(i){let total=segs.reduce((s,x)=>s+(+x.w||1),0)||1,st=-Math.PI/2;for(let k=0;k<segs.length;k++){let arc=2*Math.PI*(+segs[k].w||1)/total;if(k===i)return st+arc/2;st+=arc}return -Math.PI/2}
function draw(hi){let W=900,cx=450,R=405;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(cx,cx);ctx.rotate(angle);let total=segs.reduce((s,x)=>s+(+x.w||1),0)||1,st=-Math.PI/2;segs.forEach((it,i)=>{let arc=2*Math.PI*(+it.w||1)/total;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,st,st+arc);ctx.closePath();let g=ctx.createRadialGradient(0,0,70,0,0,R);g.addColorStop(0,'#240202');g.addColorStop(.55,colorFor(i,it.v));g.addColorStop(1,i%2?'#831b08':'#b62109');ctx.fillStyle=(i===sel&&it.v===hi)?'#fff':g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=segs.length>150?.5:1.7;ctx.stroke();if(segs.length<=100){ctx.save();const mid=st+arc/2;ctx.rotate(mid);ctx.fillStyle=(i===sel&&it.v===hi)?'#180400':'#fff';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.textAlign='center';ctx.textBaseline='middle';let t=String(it.v);if(curStep===2){t=shortenGameLabel(t,25);ctx.font='900 21px Arial';ctx.textAlign='left';ctx.translate(R*.26,0);ctx.fillText(t,0,0,R*.66)}else{ctx.translate(R*.73,0);ctx.rotate(Math.PI/2);ctx.font=segs.length>45?'bold 15px Arial':segs.length>25?'bold 20px Arial':'bold 30px Arial';if(t.length>20)t=t.slice(0,19)+'…';ctx.fillText(t,0,0)}ctx.restore()}st+=arc});ctx.beginPath();ctx.arc(0,0,95,0,7);ctx.fillStyle='#120303';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#ffbf2a';ctx.font='900 28px Arial';ctx.textAlign='center';ctx.fillText('SPIN',0,10);ctx.restore()}
function animate(ev){segs=(ev.segs||[]).map(x=>({v:String(x.v),w:+x.w||1}));if(!segs.length)return;animating=true;sel=ev.targetIndex||0;curStep=Number(ev.step)||0;$('stepText').textContent=['','1. Letter','2. Game','3. Spins','4. Bet'][ev.step]||'Wheel spin';let target=-Math.PI/2-centerFor(sel),start=angle,end=target+Math.PI*2*(ev.turns||9),t0=performance.now(),dur=ev.duration||6500,last=-1;function an(t){let p=Math.min(1,(t-t0)/dur),ease=Math.sin(p*Math.PI/2);angle=start+(end-start)*ease;let ix=pointerIndex(angle),pv=segs[ix]?.v||'';sel=ix;if(ix!==last){$('preview').textContent=pv;last=ix}draw(pv);if(p<1)requestAnimationFrame(an);else{sel=ev.targetIndex||0;angle=target;let res=segs[sel]?.v||'';$('preview').textContent=res;draw(res);animating=false}}requestAnimationFrame(an)}
function resetView(){document.body.classList.remove('hidden-all');segs=[];angle=0;sel=0;curStep=0;ctx.clearRect(0,0,900,900);$('preview').textContent='Waiting for dock spin...';$('stepText').textContent='Passive transparent wheel';}
function hideView(){document.body.classList.add('hidden-all');}
async function poll(){try{let ev=await fetch('spin-event.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());if(ev&&ev.id&&ev.id!==lastId){lastId=ev.id;if(ev.mode==='reset')resetView();else if(ev.mode==='hide')hideView();else if(ev.mode==='wheel'){document.body.classList.remove('hidden-all');animate(ev)}}}catch(e){}}setInterval(poll,250);poll();
</script></body></html>
